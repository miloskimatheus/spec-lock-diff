<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 250" width="942" height="250" role="img" aria-label="Stage A is human, stages B C and D run locked inside the platform, stage E returns to a human who only reads the automated diff" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
<title>Stage A is human, stages B C and D run locked inside the platform, stage E returns to a human who only reads the automated diff</title>

<defs><marker id="p" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="#1f2328" fill-opacity=".5"/></marker></defs>

<rect x="191" y="7" width="516" height="146" fill="none" stroke="#1f2328" stroke-width="2" opacity=".75"/>
<text x="449" y="27" text-anchor="middle" font-size="10" letter-spacing="2" fill="#1f2328" opacity=".6">LOCKED BY THE PLATFORM</text>

<g fill="none" stroke="#0B62B8" stroke-width="2.2"><rect x="1" y="45" width="146" height="66"/><rect x="751" y="45" width="190" height="66"/></g>
<text x="74" y="77" text-anchor="middle" font-size="22" font-weight="600" fill="#0B62B8">A</text>
<text x="74" y="99" text-anchor="middle" font-size="11.5" fill="#0B62B8">Spec</text>
<text x="846" y="77" text-anchor="middle" font-size="22" font-weight="600" fill="#0B62B8">E</text>
<text x="846" y="99" text-anchor="middle" font-size="11.5" fill="#0B62B8">Diff + human review</text>

<g fill="none" stroke="#A03BB0" stroke-width="2" stroke-dasharray="5 3">
<rect x="207" y="45" width="144" height="66"/><rect x="377" y="45" width="144" height="66"/><rect x="547" y="45" width="144" height="66"/></g>
<g text-anchor="middle" fill="#A03BB0">
<text x="279" y="77" font-size="22" font-weight="600">B</text><text x="449" y="77" font-size="22" font-weight="600">C</text>
<text x="619" y="77" font-size="22" font-weight="600">D</text>
<text x="279" y="99" font-size="11.5">Pre-registration</text><text x="449" y="99" font-size="11.5">Code</text>
<text x="619" y="99" font-size="11.5">Automatic CI</text></g>

<g fill="none" stroke="#1f2328" stroke-width="1.4" opacity=".5" marker-end="url(#p)">
<path d="M157 78h24"/><path d="M357 78h14"/><path d="M527 78h14"/><path d="M717 78h24"/></g>

<g fill="none" stroke="#0B62B8" stroke-width="1.4" opacity=".7"><path d="M1 129h146M751 129h190"/></g>
<text x="74" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#0B62B8">the human decides</text>
<text x="846" y="146" text-anchor="middle" font-size="11" font-weight="600" fill="#0B62B8">the human only reads</text>

<g fill="none" stroke="#1f2328" stroke-width="1" stroke-dasharray="2 3" opacity=".28">
<path d="M74 161v14M279 161v14M449 161v14M619 161v14M846 161v14"/></g>
<g font-size="9.5" text-anchor="middle" fill="#1f2328" opacity=".55">
<text x="74" y="189">no spec,</text><text x="74" y="201">no advance</text><text x="279" y="189">—</text>
<text x="449" y="189">needs a valid</text><text x="449" y="201">pre-registration</text></g>
<g font-size="9.5" text-anchor="middle" fill="#A3231A">
<text x="619" y="189">any failure</text><text x="619" y="201">blocks</text>
<text x="846" y="189">outside the interval,</text><text x="846" y="201">or off tolerance</text></g>

<g fill="none" stroke="#A3231A" stroke-width="1.4" opacity=".8"><path d="M547 221v10M941 221v10M547 226h394"/></g>
<text x="744" y="245" text-anchor="middle" font-size="9.5" letter-spacing="1.2" fill="#A3231A">THESE TWO CAN STOP THE MERGE</text>
</svg>
