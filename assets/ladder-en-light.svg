<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 282" width="942" height="282" role="img" aria-label="Five rungs, each green on its own: check on your machine; check and gate in CI; the paths nobody may quietly edit; the controls that are not code; Stage E, the diff" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
<title>Five rungs, each green on its own: check on your machine; check and gate in CI; the paths nobody may quietly edit; the controls that are not code; Stage E, the diff</title>
<rect width="942" height="282" fill="#ffffff"/>

<text x="1" y="12" font-size="10" letter-spacing="2" fill="#1f2328" opacity=".55">ADOPTION IS A LADDER, NOT A CLIFF</text>
<path d="M1 253H177H189V215H365H377V177H553H565V139H741H753V101H929" fill="none" stroke="#59636e" stroke-width="1" opacity=".35"/>
<rect x="1" y="153" width="176" height="100" fill="none" stroke="#0F6B4F" stroke-width="1.6"/><text x="11" y="169" font-size="10" letter-spacing="1.6" fill="#0F6B4F">RUNG 1</text><text x="11" y="194.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">check, on your machine</text><text x="11" y="232.0" text-anchor="start" font-size="9.5" fill="#59636e">Python and two libraries</text>
<rect x="189" y="115" width="176" height="100" fill="none" stroke="#0F6B4F" stroke-width="1.6"/><text x="199" y="131" font-size="10" letter-spacing="1.6" fill="#0F6B4F">RUNG 2</text><text x="199" y="156.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">check and gate in CI</text><text x="199" y="194.0" text-anchor="start" font-size="9.5" fill="#59636e">one file, one variable</text>
<rect x="377" y="77" width="176" height="100" fill="none" stroke="#0F6B4F" stroke-width="1.6"/><text x="387" y="93" font-size="10" letter-spacing="1.6" fill="#0F6B4F">RUNG 3</text><text x="387" y="110.8" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">the paths nobody may</text><text x="387" y="125.2" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">quietly edit</text><text x="387" y="149.2" text-anchor="start" font-size="9.5" fill="#59636e">CODEOWNERS, AGENTS.md,</text><text x="387" y="162.8" text-anchor="start" font-size="9.5" fill="#59636e">tcr.sh and branch protection</text>
<rect x="565" y="39" width="176" height="100" fill="none" stroke="#0F6B4F" stroke-width="1.6"/><text x="575" y="55" font-size="10" letter-spacing="1.6" fill="#0F6B4F">RUNG 4</text><text x="575" y="72.8" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">the controls that are</text><text x="575" y="87.2" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">not code</text><text x="575" y="111.2" text-anchor="start" font-size="9.5" fill="#59636e">the platform: identity,</text><text x="575" y="124.8" text-anchor="start" font-size="9.5" fill="#59636e">access, caps, profiles</text>
<rect x="753" y="1" width="176" height="100" fill="none" stroke="#0F6B4F" stroke-width="1.6"/><text x="763" y="17" font-size="10" letter-spacing="1.6" fill="#0F6B4F">RUNG 5</text><text x="763" y="42.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">Stage E, the diff</text><text x="763" y="73.2" text-anchor="start" font-size="9.5" fill="#59636e">a warehouse and the diff</text><text x="763" y="86.8" text-anchor="start" font-size="9.5" fill="#59636e">query, yours to write</text>
<text x="1" y="275" font-size="9.5" fill="#59636e">each rung is green on its own · stop where the value stops</text>
