<text x="1" y="396" font-size="9.5" fill="#8b949e">each prints one line per finding · <tspan font-weight="600" fill="#E58174">BLOCK</tspan> exit 1 · <tspan font-weight="600">INFO</tspan> exit 0</text><text x="941" y="396" text-anchor="end" font-size="9.5" fill="#8b949e">a filled cell is where the command runs, and what it reads there</text>
