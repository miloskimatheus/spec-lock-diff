<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 218" width="942" height="218" role="img" aria-label="Os cinco controles e o que cada um bloqueia" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
<title>Os cinco controles e o que cada um bloqueia</title>
<rect x="1" y="1" width="172" height="216" fill="none" stroke="#1F4E79" stroke-width="1.6"/>
<g transform="translate(21 22)" fill="none" stroke="#1F4E79" stroke-width="1.8"><circle cx="9" cy="9" r="7"/><path d="M14 14l11 11M21 21l4 4M25 17l4 4" stroke-linecap="round"/></g>
<text x="153" y="42" text-anchor="end" font-size="26" font-weight="600" fill="#1F4E79" opacity=".32">1</text>
<text x="21" y="94" font-size="13" font-weight="600" fill="#1f2328">Identidade</text>
<text x="21" y="112" font-size="10" fill="#1f2328" opacity=".6">role própria, bot próprio</text>
<path d="M21 132h132" stroke="#1F4E79" stroke-width="1" opacity=".5" fill="none"/>
<text x="21" y="153" font-size="10" letter-spacing="1.6" font-weight="600" fill="#1F4E79">BLOQUEIA</text>
<text x="21" y="176" font-size="10" fill="#1f2328" opacity=".78">se o agente tentar</text>
<text x="21" y="192" font-size="10" fill="#1f2328" opacity=".78">agir com o seu</text>
<text x="21" y="208" font-size="10" fill="#1f2328" opacity=".78">acesso</text>
<rect x="193" y="1" width="172" height="216" fill="none" stroke="#146B5E" stroke-width="1.6"/>
<g transform="translate(213 24)" fill="none" stroke="#146B5E" stroke-width="1.8"><path d="M1 11s5-9 13-9 13 9 13 9-5 9-13 9S1 11 1 11z"/><circle cx="14" cy="11" r="3.5"/><path d="M3 23L25 -1" stroke-linecap="round"/></g>
<text x="345" y="42" text-anchor="end" font-size="26" font-weight="600" fill="#146B5E" opacity=".32">2</text>
<text x="213" y="94" font-size="13" font-weight="600" fill="#1f2328">Acesso a dados</text>
<text x="213" y="112" font-size="10" fill="#1f2328" opacity=".6">sem raw, marts mascarados</text>
<path d="M213 132h132" stroke="#146B5E" stroke-width="1" opacity=".5" fill="none"/>
<text x="213" y="153" font-size="10" letter-spacing="1.6" font-weight="600" fill="#146B5E">BLOQUEIA</text>
<text x="213" y="176" font-size="10" fill="#1f2328" opacity=".78">se dado sensível</text>
<text x="213" y="192" font-size="10" fill="#1f2328" opacity=".78">for chegar no código,</text>
<text x="213" y="208" font-size="10" fill="#1f2328" opacity=".78">testes ou no LLM</text>
<rect x="385" y="1" width="172" height="216" fill="none" stroke="#8A5A0B" stroke-width="1.6"/>
<g transform="translate(405 24)" fill="none" stroke="#8A5A0B" stroke-width="1.8"><path d="M2 22a12 12 0 1 1 24 0" stroke-linecap="round"/><path d="M14 22l8-8" stroke-linecap="round"/><path d="M0 26h28" stroke-linecap="round"/></g>
<text x="537" y="42" text-anchor="end" font-size="26" font-weight="600" fill="#8A5A0B" opacity=".32">3</text>
<text x="405" y="94" font-size="13" font-weight="600" fill="#1f2328">Tetos de gasto</text>
<text x="405" y="112" font-size="10" fill="#1f2328" opacity=".6">teto diário → desliga</text>
<path d="M405 132h132" stroke="#8A5A0B" stroke-width="1" opacity=".5" fill="none"/>
<text x="405" y="153" font-size="10" letter-spacing="1.6" font-weight="600" fill="#8A5A0B">BLOQUEIA</text>
<text x="405" y="176" font-size="10" fill="#1f2328" opacity=".78">se uma query solta</text>
<text x="405" y="192" font-size="10" fill="#1f2328" opacity=".78">começar a drenar</text>
<text x="405" y="208" font-size="10" fill="#1f2328" opacity=".78">o orçamento</text>
<rect x="577" y="1" width="172" height="216" fill="none" stroke="#6B4E9E" stroke-width="1.6"/>
<g transform="translate(597 26)" fill="none" stroke="#6B4E9E" stroke-width="1.8"><path d="M0 24h28" stroke-linecap="round"/><path d="M4 24V13M11 24V2M18 24V16M25 24V8" stroke-linecap="round"/></g>
<text x="729" y="42" text-anchor="end" font-size="26" font-weight="600" fill="#6B4E9E" opacity=".32">4</text>
<text x="597" y="94" font-size="13" font-weight="600" fill="#1f2328">Perfis</text>
<text x="597" y="112" font-size="10" fill="#1f2328" opacity=".6">estatística, não linhas</text>
<path d="M597 132h132" stroke="#6B4E9E" stroke-width="1" opacity=".5" fill="none"/>
<text x="597" y="153" font-size="10" letter-spacing="1.6" font-weight="600" fill="#6B4E9E">BLOQUEIA</text>
<text x="597" y="176" font-size="10" fill="#1f2328" opacity=".78">se o agente fosse</text>
<text x="597" y="192" font-size="10" fill="#1f2328" opacity=".78">ver uma linha real</text>
<text x="597" y="208" font-size="10" fill="#1f2328" opacity=".78">de cliente</text>
<rect x="769" y="1" width="172" height="216" fill="none" stroke="#8C3357" stroke-width="1.6"/>
<g transform="translate(789 22)" fill="none" stroke="#8C3357" stroke-width="1.8"><path d="M14 1l12 4.6v8.2C26 20 21 24.6 14 26.4 7 24.6 2 20 2 13.8V5.6z"/><path d="M8.4 13.6l3.8 3.8 7.4-7.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="921" y="42" text-anchor="end" font-size="26" font-weight="600" fill="#8C3357" opacity=".32">5</text>
<text x="789" y="94" font-size="13" font-weight="600" fill="#1f2328">Paths protegidos</text>
<text x="789" y="112" font-size="10" fill="#1f2328" opacity=".6">CODEOWNERS + gate</text>
<path d="M789 132h132" stroke="#8C3357" stroke-width="1" opacity=".5" fill="none"/>
<text x="789" y="153" font-size="10" letter-spacing="1.6" font-weight="600" fill="#8C3357">BLOQUEIA</text>
<text x="789" y="176" font-size="10" fill="#1f2328" opacity=".78">se o agente tentar</text>
<text x="789" y="192" font-size="10" fill="#1f2328" opacity=".78">enfraquecer os testes</text>
<text x="789" y="208" font-size="10" fill="#1f2328" opacity=".78">que o julgam</text>
</svg>
