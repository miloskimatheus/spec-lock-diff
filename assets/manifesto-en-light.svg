<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 430" width="942" height="430" role="img" aria-label="The three principles feed the framework: principle 1 shapes Spec and Diff, principle 2 shapes Lock, principle 3 shapes Diff" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
<title>The three principles feed the framework: principle 1 shapes Spec and Diff, principle 2 shapes Lock, principle 3 shapes Diff</title>

<defs><marker id="a" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0 0 L9 4.5 L0 9 z" fill="#1f2328"/></marker></defs>

<g fill="none" stroke="#1f2328" stroke-width="1.6" opacity=".7">
<rect x="9" y="7" width="286" height="86"/><rect x="647" y="7" width="286" height="86"/>
<rect x="328" y="338" width="286" height="86"/></g>

<text x="34" y="62" font-size="34" font-weight="600" fill="#1f2328" opacity=".28">1</text>
<text x="80" y="46" font-size="12.5" font-weight="600" fill="#1f2328">In SQL, a bug returns a</text>
<text x="80" y="66" font-size="12.5" font-weight="600" fill="#1f2328">plausible wrong number</text>
<text x="672" y="62" font-size="34" font-weight="600" fill="#1f2328" opacity=".28">2</text>
<text x="718" y="46" font-size="12.5" font-weight="600" fill="#1f2328">Limits must live in</text>
<text x="718" y="66" font-size="12.5" font-weight="600" fill="#1f2328">the infrastructure</text>
<text x="353" y="393" font-size="34" font-weight="600" fill="#1f2328" opacity=".28">3</text>
<text x="399" y="377" font-size="12.5" font-weight="600" fill="#1f2328">Checks must be</text>
<text x="399" y="397" font-size="12.5" font-weight="600" fill="#1f2328">deterministic</text>

<text x="152" y="117" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#1f2328" opacity=".55">DECIDE BEFORE · CHECK AFTER</text>
<text x="790" y="117" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#1f2328" opacity=".55">CONTROLS, NOT INSTRUCTIONS</text>
<text x="471" y="326" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#1f2328" opacity=".55">GATES THAT NEVER VARY</text>

<g fill="none" stroke="#1f2328" stroke-width="1.5" opacity=".55" marker-end="url(#a)">
<path d="M152 128 L325 164"/><path d="M790 128 L617 164"/><path d="M471 306 L471 264"/></g>

<rect x="331" y="152" width="280" height="104" fill="none" stroke="#1f2328" stroke-width="2.2"/>
<path d="M331 186h280" stroke="#1f2328" stroke-width="1.4" opacity=".55" fill="none"/>
<path d="M424 186v70M517 186v70" stroke="#1f2328" stroke-width="1" opacity=".4" fill="none"/>
<text x="471" y="175" text-anchor="middle" font-size="10.5" letter-spacing="2.4" fill="#1f2328" opacity=".6">THE FRAMEWORK</text>
<g text-anchor="middle" fill="#1f2328" font-size="14" font-weight="600">
<text x="377" y="215">SPEC</text><text x="470" y="215">LOCK</text><text x="563" y="215">DIFF</text></g>
<g text-anchor="middle" fill="#1f2328" opacity=".5" font-size="10">
<text x="377" y="238">from 1</text><text x="470" y="238">from 2</text><text x="563" y="238">from 1 + 3</text></g>
</svg>
