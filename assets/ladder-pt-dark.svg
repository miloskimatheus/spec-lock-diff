<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 282" width="942" height="282" role="img" aria-label="Cinco degraus, cada um verde sozinho: check na sua máquina; check e gate no CI; os caminhos que ninguém edita caladinho; os controles que não são código; Etapa E, o diff" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
<title>Cinco degraus, cada um verde sozinho: check na sua máquina; check e gate no CI; os caminhos que ninguém edita caladinho; os controles que não são código; Etapa E, o diff</title>
<rect width="942" height="282" fill="#0d1117"/>

<text x="1" y="12" font-size="10" letter-spacing="2" fill="#e6edf3" opacity=".55">ADOTAR É UMA ESCADA, NÃO UM PENHASCO</text>
<path d="M1 253H177H189V215H365H377V177H553H565V139H741H753V101H929" fill="none" stroke="#8b949e" stroke-width="1" opacity=".35"/>
<rect x="1" y="153" width="176" height="100" fill="none" stroke="#4FBE8F" stroke-width="1.6"/><text x="11" y="169" font-size="10" letter-spacing="1.6" fill="#4FBE8F">DEGRAU 1</text><text x="11" y="194.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">check, na sua máquina</text><text x="11" y="232.0" text-anchor="start" font-size="9.5" fill="#8b949e">Python e duas bibliotecas</text>
<rect x="189" y="115" width="176" height="100" fill="none" stroke="#4FBE8F" stroke-width="1.6"/><text x="199" y="131" font-size="10" letter-spacing="1.6" fill="#4FBE8F">DEGRAU 2</text><text x="199" y="156.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">check e gate no CI</text><text x="199" y="194.0" text-anchor="start" font-size="9.5" fill="#8b949e">um arquivo, uma variável</text>
<rect x="377" y="77" width="176" height="100" fill="none" stroke="#4FBE8F" stroke-width="1.6"/><text x="387" y="93" font-size="10" letter-spacing="1.6" fill="#4FBE8F">DEGRAU 3</text><text x="387" y="110.8" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">os caminhos que ninguém</text><text x="387" y="125.2" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">edita caladinho</text><text x="387" y="149.2" text-anchor="start" font-size="9.5" fill="#8b949e">CODEOWNERS, AGENTS.md,</text><text x="387" y="162.8" text-anchor="start" font-size="9.5" fill="#8b949e">tcr.sh e branch protection</text>
<rect x="565" y="39" width="176" height="100" fill="none" stroke="#4FBE8F" stroke-width="1.6"/><text x="575" y="55" font-size="10" letter-spacing="1.6" fill="#4FBE8F">DEGRAU 4</text><text x="575" y="72.8" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">os controles que não são</text><text x="575" y="87.2" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">código</text><text x="575" y="111.2" text-anchor="start" font-size="9.5" fill="#8b949e">a plataforma: identidade,</text><text x="575" y="124.8" text-anchor="start" font-size="9.5" fill="#8b949e">acesso, teto, perfis</text>
<rect x="753" y="1" width="176" height="100" fill="none" stroke="#4FBE8F" stroke-width="1.6"/><text x="763" y="17" font-size="10" letter-spacing="1.6" fill="#4FBE8F">DEGRAU 5</text><text x="763" y="42.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#e6edf3">Etapa E, o diff</text><text x="763" y="73.2" text-anchor="start" font-size="9.5" fill="#8b949e">um warehouse e a query do</text><text x="763" y="86.8" text-anchor="start" font-size="9.5" fill="#8b949e">diff, que é sua</text>
<text x="1" y="275" font-size="9.5" fill="#8b949e">cada degrau fica verde sozinho · pare onde o valor parar</text>
