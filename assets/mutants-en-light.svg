<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 198" width="942" height="198" role="img" aria-label="The changed model is mutated one operator at a time; its unit tests run once against every mutant; a mutant a unit test fails on is killed, a survivor blocks the pull request, and one a human listed as equivalent informs" font-family='"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace'>
