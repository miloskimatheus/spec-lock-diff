version: 2

models:
  - name: fct_invoices
    meta:
      # A critical model: it feeds a financial report, so the spec owes three more
      # fields. The reconciliation query compares the model with something that is
      # not the model, and its tolerance is what `compare` holds the answer to.
      spec:
        grain: "one row per invoice"
        primary_key: [invoice_id]
        tier: critical
        metrics:
          invoiced_amount: "sum of invoice_total, after discounts, inside the window"
        known_edges:
          - "a cancelled invoice keeps its row, with invoice_total 0"
        sensitive_columns: [customer_document]
        reconciliation_query: analyses/reconciliation_fct_invoices.sql
        reconciliation_tolerance: "0.1%"
        external_validation: "invoiced_amount 2025-01 = 1,000,200.00 in the closing spreadsheet"
      pre_registration:
        type: data_change
        reason: "include invoices issued on the last day of the month"
        row_delta: {min: 0, max: 500}
        removed_pks: {max: 0}
        altered_columns: []
        metrics:
          invoiced_amount: {delta_pct: {min: 0.0, max: 0.1}}
    columns:
      - name: invoice_id
        tests:
          - unique
          - not_null
      - name: customer_document
        meta:
          sensitive: true
      - name: invoice_total

unit_tests:
  - name: a_cancelled_invoice_keeps_its_row
    model: fct_invoices
    config:
      meta:
        edge: "a cancelled invoice keeps its row, with invoice_total 0"
    given:
      - input: ref('stg_invoices')
        rows:
          - {invoice_id: 1, customer_document: DOC-0001, invoice_total: 400.00, invoice_date: 2025-01-31}
          - {invoice_id: 2, customer_document: DOC-0002, invoice_total: 0.00, invoice_date: 2025-01-31}
    expect:
      rows:
        - {invoice_id: 1, customer_document: DOC-0001, invoice_date: 2025-01-31, invoice_total: 400.00}
        - {invoice_id: 2, customer_document: DOC-0002, invoice_date: 2025-01-31, invoice_total: 0.00}
