version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges: []
        sensitive_columns: []
    columns:
      # The agent's model returned duplicates. Rather than fix the model, the
      # `unique` test was deleted. This is the whole of Control 5B in one diff.
      - name: order_id
        tests:
          - not_null
      - name: gross_revenue
