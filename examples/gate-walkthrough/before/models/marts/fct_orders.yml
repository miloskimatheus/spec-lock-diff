version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges: []
        sensitive_columns: []
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: gross_revenue
