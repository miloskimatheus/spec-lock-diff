version: 2

models:
  - name: fct_invoices
    meta:
      spec:
        grain: "one row per invoice"
        primary_key: [invoice_id]
        tier: critical
        metrics:
          invoiced_amount: "sum of invoice_total after discounts"
        known_edges: []
        sensitive_columns: []
        reconciliation_query: analyses/reconciliation_fct_invoices.sql
        reconciliation_tolerance: "0.1%"
        external_validation: "invoiced_amount 2025-11 = 1,000,000.00 in the closing spreadsheet"
      pre_registration:
        type: data_change
        reason: "the model changed and so did its reconciliation"
        row_delta: {min: 0, max: 5000}
        removed_pks: {max: 0}
        altered_columns: []
        metrics:
          invoiced_amount: {delta_pct: {min: 0.0, max: 2.0}}
    columns:
      - name: invoice_id
        tests:
          - unique
