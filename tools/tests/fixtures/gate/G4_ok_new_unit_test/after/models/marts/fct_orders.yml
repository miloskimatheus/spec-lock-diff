version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id

unit_tests:
  - name: cancelled_orders_are_excluded
    model: fct_orders
    description: "a cancelled order is not a row"
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, status: cancelled}
          - {order_id: 2, status: shipped}
    expect:
      rows:
        - {order_id: 2}
    overrides:
      vars:
        cutoff_date: "2025-01-01"

  - name: values_in_cents_are_divided_by_one_hundred
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 3, status: shipped, order_total_cents: 1000}
    expect:
      rows:
        - {order_id: 3, order_total: 10.0}
