version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics: {}
        known_edges: []
        sensitive_columns: []
      pre_registration:
        type: refactoring
        reason: "rename a CTE; no number moves"
        row_delta: {min: 0, max: 0}
        removed_pks: {max: 0}
        altered_columns: []
        metrics: {}
    columns:
      - name: order_id
        tests:
          - unique
