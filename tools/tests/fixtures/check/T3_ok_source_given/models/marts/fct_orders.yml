version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics: {}
        known_edges: []
        sensitive_columns: []
    columns:
      - name: order_id
        tests:
          - unique

unit_tests:
  - name: orders_come_from_the_source
    model: fct_orders
    given:
      - input: source('raw', 'orders')
        rows:
          - {order_id: 1}
    expect:
      rows:
        - {order_id: 1}
