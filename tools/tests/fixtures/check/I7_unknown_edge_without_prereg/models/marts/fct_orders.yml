version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges:
          - "status='cancelled' -> row excluded"
        sensitive_columns: [customer_email]
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_email
        meta:
          sensitive: true
      - name: gross_revenue

unit_tests:
  - name: cancelled_orders_are_excluded
    model: fct_orders
    config:
      meta:
        edge: "a rule the spec never wrote"
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, status: shipped, order_total: 100.0}
          - {order_id: 3, status: cancelled, order_total: 90.0}
    expect:
      rows:
        - {order_id: 1, gross_revenue: 100.0}
