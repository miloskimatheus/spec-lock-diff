version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges: []
        sensitive_columns: []
      pre_registration:
        type: data_change
        reason: "the change this pull request makes, in one sentence"
        row_delta: {min: 0, max: 1000}
        removed_pks: {max: 0}
        altered_columns: []
        metrics:
          gross_revenue: {delta_pct: {min: 0.0, max: 0.8}}
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id

unit_tests:
  - name: every_order_finds_its_customer
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 7}
    expect:
      rows:
        - {order_id: 1, customer_id: 7}
