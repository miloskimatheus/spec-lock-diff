version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges: []
        sensitive_columns: []
      pre_registration:
        type: refactoring
        reason: "extract the discount rule into a CTE; nothing may move"
        row_delta: {min: 0, max: 0}
        removed_pks: {max: 0}
        altered_columns: []
        metrics:
          gross_revenue: {delta_pct: {min: 0, max: 0}}
    columns:
      - name: order_id
        tests:
          - unique
      - name: gross_revenue
