version: 2

models:
  - name: fct_orders
    meta:
      spec:
        grain: "one row per order"
        primary_key: [order_id]
        tier: standard
        metrics:
          gross_revenue: "sum of order_total before discounts and taxes"
        known_edges: []
        sensitive_columns: []
      pre_registration:
        type: data_change
        reason: "new model; production has no fct_orders yet"
        row_delta: {min: 1200000, max: 1300000}
        removed_pks: {max: 0}
        altered_columns: []
        metrics:
          gross_revenue: {value: {min: 14000000, max: 14400000}}
    columns:
      - name: order_id
        tests:
          - unique
      - name: gross_revenue
