# Spec-Lock-Diff - the gates that need no warehouse. Copy to .github/workflows/ci.yml.
#
# This is the first rung. It runs `check` and `gate` - twenty-one of the thirty
# rules, and the whole of Control 5B - with Python and git and nothing else. No
# adapter, no credentials, no production artifacts. Copy it, set one repository
# variable, and the first run is green.
#
# Stage D's build and the whole of Stage E live in ci-warehouse.yml, which you
# copy when you are ready to point the framework at your warehouse. Until then
# those checks are absent, and absent is the honest state: a check that is
# present and passes without having looked at anything is the one thing this
# framework exists to prevent.
#
# The job name below, `ci`, is what you list as a required check in branch
# protection. Renaming a job means changing that list too, or the gate stops
# gating. When you copy ci-warehouse.yml, add `build` and `diff` to that list.
#
# .github/ is a protected path (Control 5A), so only humans edit this file.
# That is deliberate: an agent that can edit the CI controls the rules. A
# workflow runs from the pull request's own tree, so CODEOWNERS is the only
# thing standing between the agent and this file; gate rule G9 makes the
# attempt a red check, but the gate it runs is the one wired below, so read
# this file's diff whenever a pull request touches it.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One run per pull request per workflow. A new push cancels the run it replaced.
# The group carries github.workflow because concurrency groups are shared by
# every workflow in a repository: two files with one group would cancel each
# other on every push, and the cancelled one reports nothing at all.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# YOU: set the repository variable AGENT_LOGIN to the bot user of Control 1
# (Settings > Secrets and variables > Actions > Variables). The gate is required
# on the pull requests that user opens - the opener of a pull request is an
# identity the platform authenticates, unlike the author of a commit, which is
# text - and advisory on everyone else's: a human who changes a macro or bumps a
# package in a pull request of their own is what Rule 8 asks for, and CODEOWNERS
# is what judges it. Left unset, the gate is required on every pull request. A
# variable nobody set must not make it optional anywhere.
#
# This block lives in this file and only in this file. Copied into a second
# workflow without the variable, `env.AGENT_PR != 'true'` reads an empty string
# as true, the advisory branch runs with continue-on-error, and the required
# gate quietly never runs at all.
env:
  AGENT_PR: ${{ vars.AGENT_LOGIN == '' || github.event.pull_request.user.login == vars.AGENT_LOGIN }}

jobs:
  # Runs on every push to the branch. README section 3, Stage D, the static half:
  # it reads yml, git and one line of sql, so it costs minutes nobody notices.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate walks the commits of the pull request, so it needs them all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The only two libraries tools/slp.py uses, and the only two installed here.
      # No dbt, no adapter, no driver: that is what keeps this rung free. The
      # jsonschema floor is not decoration - the schemas are draft 2020-12, and
      # that validator arrived in 4.0.
      - run: pip install "pyyaml" "jsonschema>=4"

      # The gate must not be judged by whoever it judges. A pull request that
      # edits tools/ would otherwise run its own version of the gate on itself -
      # G9 blocks the edit, but the edited gate is what would be running. So the
      # three commands run from the copy on the branch the pull request targets.
      # On the pull request that first adds tools/ there is no such copy; the
      # step says so and uses this one.
      - name: the tools from the base branch
        run: |
          base=${{ github.event.pull_request.base.sha }}
          rm -rf "$RUNNER_TEMP/tools" "$RUNNER_TEMP/base-tools"
          if git cat-file -e "$base:tools/slp.py" 2>/dev/null; then
            git archive "$base" tools | tar -x -C "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/tools" "$RUNNER_TEMP/base-tools"
          else
            echo "tools/ is not on the base branch yet; this run judges with the pull request's own copy" >&2
            cp -r tools "$RUNNER_TEMP/base-tools"
          fi
          echo "SLP=$RUNNER_TEMP/base-tools/slp.py" >> "$GITHUB_ENV"

      # Stage A and Rule 2: every marts model has a complete spec, a valid
      # pre-registration when it has one, and a uniqueness test on its primary key.
      #
      # YOU: if your marts do not live in models/marts/, add --marts-path for each
      # directory that does hold them, here, on the gate below, and on the check
      # and compare steps of ci-warehouse.yml. Read the summary line: it says how
      # many models were held to the framework and how many were read at all, and
      # only the first is coverage.
      - name: slp check
        run: python "$SLP" check

      # Control 5B: nothing on this branch weakened a test, a unit test, a
      # reconciliation, a package pin, a protected path or a spec - and no model's
      # sql changed without a pre-registration to hold its numbers against. The
      # output goes to the job summary so the Author reads it without opening the
      # logs (Stage B asks for the pre-registration change counter to be visible
      # in review). Required on the agent's pull requests: see AGENT_PR above.
      - name: slp gate
        if: env.AGENT_PR == 'true'
        shell: bash  # bash -eo pipefail, so tee cannot swallow a failure
        run: |
          # The findings are tab separated. Without a fence the job summary
          # renders them as one paragraph, which is unreadable; the trap closes
          # the fence even when the gate blocks and -e ends the step.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "```" >> "$GITHUB_STEP_SUMMARY"' EXIT
          python "$SLP" gate \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The same gate on a pull request a human opened. Its findings go to the
      # job summary for the code owners to read; its exit code does not fail the
      # job, because CODEOWNERS is what decides those pull requests (Control 5A).
      - name: slp gate (advisory)
        if: env.AGENT_PR != 'true'
        continue-on-error: true
        shell: bash  # bash -eo pipefail, so the step's own status still says what the gate said
        run: |
          echo 'This pull request was not opened by the agent identity, so the gate is advisory here: read it, and CODEOWNERS decides.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "```" >> "$GITHUB_STEP_SUMMARY"' EXIT
          python "$SLP" gate \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
