# The framework applies its own Control 5B to this repository: the rules in
# tools/ are checked by a machine on every change, not by good intentions.
name: tools tests

on:
  pull_request:
  push:
    branches: [main]
  # Mondays, 06:00 UTC: the mutants job on main, so the equivalents list
  # cannot go stale unnoticed between pull requests.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The only dependencies the tools are allowed to have (backlog rule R5).
      # jsonschema is floored because the schemas are draft 2020-12, and
      # Draft202012Validator arrived in 4.0.
      - run: pip install pyyaml "jsonschema>=4" pytest
      - run: pytest tools/tests -q
      # The two numbers of tools/tests/crap.py - 100 percent of the tool's
      # branches covered, CRAP at most 30 per function - on one leg only:
      # coverage.py attributes lines differently across Python versions, and a
      # threshold that moves with the interpreter is not a threshold. The plain
      # suite above still runs on both legs.
      - if: matrix.python-version == '3.12'
        run: |
          pip install "coverage>=7,<8"
          coverage run --branch --source=tools/spec_lock_diff -m pytest tools/tests -q
          python tools/tests/crap.py
      # ruff's two defaults, a cyclomatic complexity of 10 per function and 100
      # columns per line, and its formatter; the configuration is in pyproject.
      - if: matrix.python-version == '3.12'
        run: |
          pip install "ruff>=0.16,<1"
          ruff check tools
          ruff format --check tools
      # Every annotation checked, strictly; the stub packages type the two libraries.
      - if: matrix.python-version == '3.12'
        run: |
          pip install "mypy>=2,<3" types-PyYAML types-jsonschema
          mypy

  # Every commit of a pull request is green on its own: test && commit ||
  # revert, applied to this repository. A red commit in the middle of a branch
  # is a state nobody can bisect to, and the suite costs twelve seconds.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml "jsonschema>=4" pytest
      - run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          for commit in $(git rev-list --first-parent --reverse "$base..$head"); do
            git checkout -q "$commit"
            echo "== $commit $(git log -1 --format=%s)"
            pytest tools/tests -q -p no:cacheprovider || { echo "red at $commit" >&2; exit 1; }
          done

  # Every mutant of the tool is killed (tools/tests/mutants.py): a mutant that
  # survives is a test the suite should have had. Required on a pull request
  # that touches the tool, its schemas or its tests; on any other it says it
  # had nothing to mutate and passes - a green that names what it did not look
  # at. On the weekly run there is no base, so every mutant runs.
  mutants:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml "jsonschema>=4" pytest
      - run: |
          base=${{ github.event.pull_request.base.sha }}
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- tools/slp.py tools/spec_lock_diff tools/tests; then
            echo "nothing to mutate: the tool and its tests are as the base branch has them"
          else
            python tools/tests/mutants.py --jobs 4
          fi
